[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-monitor-contracts"
version = "0.1.0"
description = "The strategy plugin interface for trade-monitor. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "pothak and trade-monitor contributors" }]
keywords = ["trading", "strategy", "plugin", "framework", "open-source"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
]

# No dependencies, on purpose. A strategy author installs the interface and
# nothing else. See spec/DEPENDENCIES.md D4.
dependencies = []

[project.urls]
Homepage = "https://github.com/pothak/trade-monitor"
Repository = "https://github.com/pothak/trade-monitor"

[tool.setuptools]
packages = ["trade_monitor_contracts"]
